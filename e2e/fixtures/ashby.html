<!doctype html>
<!-- Ashby application form fixture (P2.6). Ashby keys fields off data-field-id
     rather than name/id, so a change there breaks silently without this test. -->
<html><head><meta charset="utf-8"><title>Mobile Engineer — Ashby</title></head>
<body><h1>Mobile Engineer</h1>
<form>
  <input data-field-id="firstName" />
  <input data-field-id="lastName" />
  <input data-field-id="email" type="email" />
  <input data-field-id="phone" type="tel" />
  <input data-field-id="linkedin" />
  <input data-field-id="location" />
</form></body></html>
