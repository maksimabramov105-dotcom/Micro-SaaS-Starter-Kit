<!doctype html>
<!-- Lever application form fixture (P2.6). Lever uses a single `name` field and
     bracketed urls[...] inputs, which is why it has its own filler. -->
<html><head><meta charset="utf-8"><title>Backend Engineer — Lever</title>
<meta property="og:title" content="Backend Engineer" />
<meta property="og:site_name" content="Globex" />
<meta property="og:description" content="Backend engineer, Go and Postgres." />
</head><body><h1>Backend Engineer</h1>
<form>
  <input name="name" />
  <input name="email" type="email" />
  <input name="phone" type="tel" />
  <input name="org" />
  <input name="urls[LinkedIn]" />
  <input name="urls[Other]" />
  <textarea name="comments"></textarea>
</form></body></html>
