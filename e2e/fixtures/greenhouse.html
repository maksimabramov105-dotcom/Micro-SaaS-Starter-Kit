<!doctype html>
<!-- Greenhouse application form fixture (P2.6). Field names/ids mirror a real
     Greenhouse board so the selectors in extension/content/autofill.js are
     exercised exactly as they are in production. -->
<html><head><meta charset="utf-8"><title>Senior Platform Engineer at Acme — Greenhouse</title>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"JobPosting","title":"Senior Platform Engineer",
 "hiringOrganization":{"@type":"Organization","name":"Acme Corp"},
 "description":"We need a platform engineer for Kubernetes, Terraform and CI/CD."}
</script></head>
<body><h1>Senior Platform Engineer</h1>
<form id="application_form">
  <input id="first_name" name="first_name" />
  <input id="last_name" name="last_name" />
  <input id="email" name="email" type="email" />
  <input id="phone" name="phone" type="tel" />
  <input name="job_application[answers_attributes][0][text_value]" placeholder="LinkedIn Profile" />
  <input placeholder="Website" />
  <textarea id="cover_letter" name="cover_letter"></textarea>
</form></body></html>
